# Run the "saas-starter" example against PostgreSQL.
#
#   docker compose -f examples/saas-starter/docker-compose.yml up --build
#
# The binary is built with the pure-Go postgresql adapter and reads DATABASE_*
# on boot to reach this database.
#
# NOTE: the committed migrations under db/migrations are SQLite-flavoured and do
# not apply to Postgres as-is. Generate Postgres migrations before relying on the
# data layer; the app boots and connects regardless.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pola
      POSTGRES_PASSWORD: pola
      POSTGRES_DB: saas_starter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pola -d saas_starter"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: examples/saas-starter/Dockerfile
    environment:
      PORT: "3000"
      DATABASE_ADAPTER: postgresql
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: pola
      DATABASE_PASSWORD: pola
      DATABASE_NAME: saas_starter
      DATABASE_SSLMODE: disable
      BASE_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me-0000000000000000000000000000000000000000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
