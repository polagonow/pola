name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and release binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe` stamps the exact release
          # version into the binaries via -ldflags (see magefile.go).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Cross-compiles darwin/linux/windows × amd64/arm64 (CGO-free, pure-Go
      # goja VM) into build/.
      - name: Build all platforms
        run: go run mage.go dist:all

      - name: Smoke-test host binary
        run: ./build/pola-linux-amd64 --version

      # Signs and notarizes the macOS binaries with quill (works from Linux —
      # no macOS runner or Keychain needed) so Gatekeeper doesn't flag browser
      # downloads. Runs only when Apple credentials are configured as secrets;
      # without them the release ships unsigned, and install.sh / xattr remain
      # the documented workarounds. Required secrets (base64 contents or raw):
      #   QUILL_SIGN_P12       Developer ID Application cert (.p12, base64)
      #   QUILL_SIGN_PASSWORD  p12 password
      #   QUILL_NOTARY_KEY     App Store Connect API private key (.p8, base64)
      #   QUILL_NOTARY_KEY_ID  API key ID
      #   QUILL_NOTARY_ISSUER  API issuer ID
      - name: Sign and notarize macOS binaries
        if: ${{ secrets.QUILL_SIGN_P12 != '' }}
        env:
          QUILL_SIGN_P12: ${{ secrets.QUILL_SIGN_P12 }}
          QUILL_SIGN_PASSWORD: ${{ secrets.QUILL_SIGN_PASSWORD }}
          QUILL_NOTARY_KEY: ${{ secrets.QUILL_NOTARY_KEY }}
          QUILL_NOTARY_KEY_ID: ${{ secrets.QUILL_NOTARY_KEY_ID }}
          QUILL_NOTARY_ISSUER: ${{ secrets.QUILL_NOTARY_ISSUER }}
        run: |
          curl -sSfL https://get.anchore.io/quill | sh -s -- -b "$RUNNER_TEMP/bin" v0.7.1
          "$RUNNER_TEMP/bin/quill" sign-and-notarize build/pola-darwin-arm64
          "$RUNNER_TEMP/bin/quill" sign-and-notarize build/pola-darwin-amd64

      # Packages the (possibly signed) binaries into build/dist/ as
      # .tar.gz / .zip. Notarization tickets can't be stapled to bare CLI
      # binaries, so Gatekeeper verifies them online on first run.
      - name: Package all platforms
        run: go run mage.go dist:package

      - name: Generate checksums
        run: |
          cd build/dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/*.tar.gz
            build/dist/*.zip
            build/dist/checksums.txt
          generate_release_notes: true
