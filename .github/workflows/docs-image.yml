name: Docs image

# Builds the Pola docs site (examples/fumadocs-docs) into a container image and
# publishes it to GHCR once a release has been published, stamped with that
# release's version. Pull requests touching the docs only build the image.
#
# Triggered via workflow_run rather than `release: published`: the Release
# workflow creates the release with GITHUB_TOKEN, and events raised by
# GITHUB_TOKEN do not start other workflows.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - "examples/fumadocs-docs/**"
      - ".dockerignore"
      - ".github/workflows/docs-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the docs for (e.g. v1.2.3)
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pola-docs

jobs:
  build:
    name: Build and publish
    # Only publish after a successful release run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # The Release workflow runs on tag pushes, so its head_branch is the tag.
      - name: Resolve version
        id: version
        env:
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_run)      tag="$RUN_TAG" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            *)                 tag="dev" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || steps.version.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr

      # The build context is the repo root: the example resolves the framework
      # through `replace github.com/polagonow/pola => ../..`.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/fumadocs-docs/Dockerfile
          platforms: linux/amd64
          build-args: POLA_VERSION=${{ steps.version.outputs.tag }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
