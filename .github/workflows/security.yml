name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan of the default branch so newly published CVEs surface
    # even when no code changes.
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # upload-sarif reads workflow-run metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Full repo scan (dependencies, secrets, IaC misconfigs) reported to the
      # GitHub Security tab. Never fails the build — the gate step below does.
      - name: Trivy repository scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      # Code scanning upload needs GitHub Advanced Security on private repos;
      # continue-on-error keeps the job green without it. The gate step below
      # is the enforced check either way.
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # Gate: fail the job on fixable CRITICAL/HIGH vulnerabilities in
      # dependencies. Secrets/misconfig findings stay report-only in the
      # Security tab (examples/ contains intentional dev fixtures).
      - name: Trivy vulnerability gate (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"
